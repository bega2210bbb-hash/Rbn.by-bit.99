<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM BAZAR — Доска Объявлений Туркменистана</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.85);
            --accent-gold: #f0b90b;
            --accent-green: #0ecb81;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f3f8;
            --text-sub: #848e9c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: radial-gradient(circle at top, #151c2c, var(--bg-color)); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

        header {
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(11, 14, 20, 0.85);
            border-bottom: 1px solid var(--border);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(45deg, var(--accent-gold), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
        }

        .btn-add {
            background: linear-gradient(45deg, var(--accent-gold), #e0a800);
            color: #000; font-weight: bold; border: none;
            padding: 10px 20px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(240, 185, 11, 0.3);
            transition: transform 0.2s;
        }
        .btn-add:hover { transform: scale(1.05); }

        .categories-bar {
            display: flex; gap: 10px; overflow-x: auto;
            padding: 20px 5%; background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: var(--card-bg); color: var(--text-sub);
            border: 1px solid var(--border); padding: 10px 20px;
            border-radius: 12px; cursor: pointer; white-space: nowrap;
            font-weight: 600; transition: all 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            color: var(--text-main); background: rgba(240, 185, 11, 0.15);
            border-color: var(--accent-gold);
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; margin-top: 20px;
        }

        .ad-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex; flex-direction: column;
        }
        .ad-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        .ad-img { width: 100%; height: 200px; object-fit: cover; background: #1a202c; }
        .ad-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        .ad-badge {
            display: inline-block; padding: 3px 8px; border-radius: 6px;
            font-size: 11px; font-weight: bold; background: rgba(240, 185, 11, 0.2);
            color: var(--accent-gold); margin-bottom: 8px; width: fit-content;
        }
        .ad-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .ad-price { font-size: 18px; color: var(--accent-green); font-weight: bold; margin-bottom: 12px; }
        .ad-info { font-size: 13px; color: var(--text-sub); border-top: 1px solid var(--border); pt: 10px; margin-top: 10px; }

        .btn-call {
            display: block; width: 100%; text-align: center;
            background: rgba(14, 203, 129, 0.15); color: var(--accent-green);
            border: 1px solid var(--accent-green); padding: 8px;
            border-radius: 8px; text-decoration: none; font-weight: bold;
            margin-top: 10px; transition: background 0.2s;
        }
        .btn-call:hover { background: var(--accent-green); color: #000; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            border-radius: 20px; width: 100%; max-width: 500px;
            padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: var(--accent-gold); font-size: 20px; }
        .close-btn { font-size: 24px; color: var(--text-sub); cursor: pointer; border: none; background: none; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
        .form-control {
            width: 100%; background: #0d1117; border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 14px;
        }
        .form-control:focus { border-color: var(--accent-gold); outline: none; }

        /* Стиль для кнопки загрузки фото */
        .file-upload-btn {
            background: #1e2533;
            border: 1px dashed var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            display: block;
        }
        .file-upload-btn input[type="file"] { display: none; }
        .img-preview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }

        .rules-note {
            font-size: 11px; color: #f6465d; background: rgba(246, 70, 93, 0.1);
            padding: 10px; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid #f6465d;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✨ TM BAZAR</div>
        <button class="btn-add" onclick="openModal()">+ Разместить объявление</button>
    </header>

    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('all')">🌐 Все объявления</button>
        <button class="cat-btn" onclick="filterCategory('Работа')">💼 Работа и Вакансии</button>
        <button class="cat-btn" onclick="filterCategory('Недвижимость')">🏠 Недвижимость</button>
        <button class="cat-btn" onclick="filterCategory('Электроника')">📱 Электроника и Телефоны</button>
        <button class="cat-btn" onclick="filterCategory('Авто')">🚗 Авто и Запчасти</button>
    </div>

    <div class="container">
        <h2 id="section-title" style="color: var(--accent-gold); font-size: 20px;">🔥 Все свежие объявления</h2>
        
        <div class="ads-grid" id="ads-container"></div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Подать объявление</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div class="rules-note">
                🚫 <b>Правила:</b> Запрещен контент 18+, порнография и нецензурная лексика. Объявления с нарушениями удаляются.
            </div>

            <form id="addForm" onsubmit="submitAd(event)">
                <div class="form-group">
                    <label>Категория *</label>
                    <select class="form-control" id="adCategory" required>
                        <option value="Работа">💼 Работа и Вакансии</option>
                        <option value="Недвижимость">🏠 Недвижимость</option>
                        <option value="Электроника">📱 Электроника</option>
                        <option value="Авто">🚗 Авто и Запчасти</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Название объявления *</label>
                    <input type="text" class="form-control" id="adTitle" placeholder="Например: Продаю iPhone 15 Pro" required>
                </div>

                <div class="form-group">
                    <label>Цена / Зарплата *</label>
                    <input type="text" class="form-control" id="adPrice" placeholder="Например: 5 000 TMT" required>
                </div>

                <div class="form-group">
                    <label>Ваше Имя *</label>
                    <input type="text" class="form-control" id="adName" placeholder="Введите имя" required>
                </div>

                <div class="form-group">
                    <label>Номер телефона *</label>
                    <input type="tel" class="form-control" id="adPhone" placeholder="+993 6X XX-XX-XX" required>
                </div>

                <!-- ПОЛЕ ДЛЯ ВЫБОРА ФОТО ИЗ ПАМЯТИ ТЕЛЕФОНА -->
                <div class="form-group">
                    <label>Фотография вещи</label>
                    <label class="file-upload-btn">
                        📷 Выбрать фото из галереи
                        <input type="file" id="adFile" accept="image/*" onchange="previewFile()">
                    </label>
                    <img id="preview" class="img-preview" alt="Предпросмотр">
                </div>

                <button type="submit" class="btn-add" style="width: 100%; padding: 12px; margin-top: 10px;">Опубликовать объявление</button>
            </form>
        </div>
    </div>

    <script>
        let uploadedBase64Image = "";

        let adsData = [
            {
                id: 1,
                category: "Работа",
                title: "Требуется Веб-дизайнер / SMM специалист",
                price: "4 000 TMT",
                name: "Мурат",
                phone: "+99365000000",
                img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&q=80"
            },
            {
                id: 2,
                category: "Электроника",
                title: "iPhone 15 Pro Max 256GB Natural Titanium",
                price: "18 500 TMT",
                name: "Сердар",
                phone: "+99364123456",
                img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500&q=80"
            }
        ];

        const BANNED_WORDS = ["порно", "18+", "porno", "sex", "секс", "интим", "казино", "нарко"];

        // Функция предпросмотра фото из памяти телефона
        function previewFile() {
            const preview = document.getElementById('preview');
            const file = document.getElementById('adFile').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                preview.src = reader.result;
                preview.style.display = "block";
                uploadedBase64Image = reader.result; // Сохраняем фото в формате Base64
            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        function renderAds(filter = 'all') {
            const container = document.getElementById('ads-container');
            container.innerHTML = '';

            const filtered = filter === 'all' ? adsData : adsData.filter(item => item.category === filter);

            if (filtered.length === 0) {
                container.innerHTML = '<p style="color:var(--text-sub); grid-column: 1/-1; text-align:center; padding: 40px;">В этой категории пока нет объявлений. Будьте первым!</p>';
                return;
            }

            filtered.forEach(ad => {
                const defaultImg = "https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500&q=80";
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.innerHTML = `
                    <img src="${ad.img || defaultImg}" class="ad-img" alt="${ad.title}">
                    <div class="ad-body">
                        <div>
                            <span class="ad-badge">${ad.category}</span>
                            <div class="ad-title">${ad.title}</div>
                            <div class="ad-price">${ad.price}</div>
                        </div>
                        <div class="ad-info">
                            👤 <b>${ad.name}</b><br>
                            📞 ${ad.phone}
                            <a href="tel:${ad.phone}" class="btn-call">Позвонить</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('section-title').innerText = cat === 'all' ? '🔥 Все свежие объявления' : 'Категория: ' + cat;
            renderAds(cat);
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('addModal').style.display = 'none'; 
            document.getElementById('preview').style.display = 'none';
            uploadedBase64Image = "";
        }

        function submitAd(e) {
            e.preventDefault();

            const title = document.getElementById('adTitle').value;
            const category = document.getElementById('adCategory').value;
            const price = document.getElementById('adPrice').value;
            const name = document.getElementById('adName').value;
            const phone = document.getElementById('adPhone').value;

            // Проверка модерации
            const fullText = (title + " " + name).toLowerCase();
            const hasBannedWord = BANNED_WORDS.some(word => fullText.includes(word));

            if (hasBannedWord) {
                alert("❌ Ошибка публикации! Ваше объявление содержит запрещенные слова или контент 18+.");
                return;
            }

            // Добавляем объявление с загруженным из телефона фото
            adsData.unshift({
                id: Date.now(),
                category, title, price, name, phone, 
                img: uploadedBase64Image
            });

            renderAds('all');
            closeModal();
            document.getElementById('addForm').reset();
            alert("✅ Ваше объявление успешно опубликовано!");
        }

        renderAds();
    </script>
</body>
</html>
